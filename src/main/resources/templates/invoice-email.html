<div style="font-family:system-ui,sans-serif;max-width:560px;margin:0 auto;padding:32px;border:1px solid #E5E7EB;border-radius:8px">
  <h2 style="color:#1E3A8A;margin:0 0 4px">Marvex</h2>
  <p style="color:#6B7280;margin:0 0 24px;font-size:13px">Payment Invoice</p>
  <hr style="border:none;border-top:1px solid #E5E7EB;margin-bottom:24px"/>
  <table style="width:100%;font-size:14px;border-collapse:collapse">
    <tr><td style="padding:8px 0;color:#6B7280">Invoice to</td><td style="padding:8px 0;font-weight:600;text-align:right">{{businessName}}</td></tr>
    <tr><td style="padding:8px 0;color:#6B7280">Payment ID</td><td style="padding:8px 0;font-family:monospace;font-size:12px;text-align:right">{{paymentId}}</td></tr>
    <tr><td style="padding:8px 0;color:#6B7280">Date</td><td style="padding:8px 0;text-align:right">{{date}}</td></tr>
    <tr><td style="padding:8px 0;color:#6B7280">Status</td><td style="padding:8px 0;text-align:right"><span style="background:#DCFCE7;color:#16A34A;padding:2px 10px;border-radius:20px;font-weight:700;font-size:12px">PAID</span></td></tr>
  </table>
  <hr style="border:none;border-top:1px solid #E5E7EB;margin:20px 0"/>
  <table style="width:100%;font-size:14px;border-collapse:collapse;margin-top:4px">
    <tr><td style="padding:8px 0;font-size:15px;font-weight:700;color:#111827">Total</td>
    <td style="padding:8px 0;font-size:22px;font-weight:800;color:#1E3A8A;text-align:right">{{currency}} {{amount}}</td></tr>
  </table>
  <p style="margin:32px 0 0;font-size:12px;color:#9CA3AF;text-align:center">Generated by Marvex &middot; {{baseUrl}}</p>
</div>
