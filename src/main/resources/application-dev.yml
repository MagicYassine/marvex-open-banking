app:
  base-url: ${APP_BASE_URL}

infisical:
  client-id: ${INFISICAL_CLIENT_ID}
  client-secret: ${INFISICAL_CLIENT_SECRET}
  project-id: ${INFISICAL_PROJECT_ID}
  environment-slug: dev

spring:
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry-ms: 900000
  refresh-token-expiry-ms: 604800000

webhook:
  secret: ${WEBHOOK_SECRET}

payment:
  provider: ${PAYMENT_PROVIDER}
  max-amount-pence: ${PAYMENT_MAX_AMOUNT_PENCE:100000}

yapily:
  basic-token: ${YAPILY_BASIC_TOKEN}
  user-uuid: ${YAPILY_USER_UUID}
  callback: ${APP_BASE_URL}/pay
